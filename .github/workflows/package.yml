name: Package desktop apps

on:
  workflow_dispatch:
    inputs:
      production:
        description: Build signed production installers (requires release-signing environment)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match ' + expected); process.exit(1); }"

  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
            target: mac
            extension: dmg
          - platform: macos
            arch: arm64
            runner: macos-15
            target: mac
            extension: dmg
          - platform: windows
            arch: x64
            runner: windows-2025
            target: win
            extension: exe
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            target: win
            extension: exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: ${{ inputs.production && 'release-signing' || 'pilot-builds' }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.production && 'true' || 'false' }}
      SIGNED_BUILD: ${{ inputs.production && 'true' || 'false' }}
      # Force BCJ 7z compression filter to fix missing binaries on Windows ARM64 caused by nsis7z codec incompatibility
      ELECTRON_BUILDER_7Z_FILTER: "BCJ"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package unsigned application
        if: ${{ !inputs.production }}
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish=never

      - name: Package signed macOS application
        if: inputs.production && matrix.platform == 'macos'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "for (const key of ['CSC_LINK', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID']) { if (!process.env[key]) { console.error('Required signing secret is missing: ' + key); process.exit(1); } }"
          npx electron-builder --mac --${{ matrix.arch }} --publish=never

      - name: Package signed Windows application
        if: inputs.production && matrix.platform == 'windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          node -e "if (!process.env.CSC_LINK) { console.error('Required signing secret is missing: WIN_CSC_LINK'); process.exit(1); }"
          npx electron-builder --win --${{ matrix.arch }} --publish=never

      - name: Native packaged application smoke test
        run: node scripts/smoke-package.mjs ${{ matrix.arch }}

      - name: Verify production signature
        if: inputs.production
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            codesign --verify --deep --strict dist/mac*/SitremPrinter.app
            xcrun stapler validate dist/mac*/SitremPrinter.app
            spctl --assess --type execute dist/mac*/SitremPrinter.app
          else
            pwsh -NoProfile -Command '$signature = Get-AuthenticodeSignature (Get-ChildItem dist/*.exe).FullName; if ($signature.Status -ne "Valid") { throw "Installer signature is invalid" }'
          fi

      - name: Verify installer inventory and hashes
        run: node scripts/verify-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Upload installer and blockmap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sitrem-printer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.${{ matrix.extension }}
            dist/*.${{ matrix.extension }}.blockmap
            dist/*.manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - validate-version
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sitrem-printer-*
          path: artifacts
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs artifacts
