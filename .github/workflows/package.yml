name: Package desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match ' + expected); process.exit(1); }"

  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
            target: mac
            extension: dmg
          - platform: macos
            arch: arm64
            runner: macos-15
            target: mac
            extension: dmg
          - platform: windows
            arch: x64
            runner: windows-2025
            target: win
            extension: exe
          - platform: windows
            arch: arm64
            runner: windows-2025
            target: win
            extension: exe
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder requires the configured generic provider URL to expand.
      # Auto-updates are not active, and updater metadata is not published here.
      SITREM_UPDATE_URL: https://updates.invalid/
      # Force BCJ 7z compression filter to fix missing binaries on Windows ARM64 caused by nsis7z codec incompatibility
      ELECTRON_BUILDER_7Z_FILTER: "BCJ"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package application
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish=never

      - name: Upload installer and blockmap
        uses: actions/upload-artifact@v7
        with:
          name: sitrem-printer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.${{ matrix.extension }}
            dist/*.${{ matrix.extension }}.blockmap
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - validate-version
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: sitrem-printer-*
          path: artifacts
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
