name: Recover release publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.6
        required: true
        type: string
      run_id:
        description: Original package workflow run containing complete artifacts
        required: true
        type: string
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          node scripts/validate-release-run.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: sitrem-printer-*
          path: artifacts
          merge-multiple: true
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/publish-release.mjs artifacts
